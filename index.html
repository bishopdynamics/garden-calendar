<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claremont Garden Calendar</title>
<style>
:root {
  --bg: #f6f3ec; --panel: #ffffff; --ink: #24301f; --muted: #6b7363; --line: #e3ddd0;
  --accent: #3f7a3a; --accent-soft: #e4efdf;
  --indoors: #8a5cc7; --sow: #3f8f3a; --transplant: #2a86a8; --plant: #b07a2a; --harvest: #d0572f; --hydro: #1f63c9;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161a14; --panel: #20261d; --ink: #e8ecdf; --muted: #9aa392; --line: #333b2e;
    --accent: #7cc271; --accent-soft: #2b3a27;
    --indoors: #a784dd; --sow: #6cbb5f; --transplant: #4fb1d3; --plant: #d3a04f; --harvest: #f07a52; --hydro: #6aa6ff;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { padding: 22px 24px 8px; max-width: 1400px; margin: 0 auto; }
h1 { margin: 0; font-size: 26px; letter-spacing: -.01em; }
.sub { color: var(--muted); margin-top: 2px; }
main { max-width: 1400px; margin: 0 auto; padding: 0 24px 60px; }

.months { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; margin: 16px 0 12px; }
.months button { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 9px 0; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; position: relative; }
.months button:hover { border-color: var(--accent); }
.months button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.months button.today::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 5px; height: 5px;
  margin-left: -2.5px; border-radius: 50%; background: currentColor; opacity: .6; }

.note { background: var(--accent-soft); border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; }
.note b { margin-right: 6px; }

.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600;
  padding: 6px 12px; border-radius: 7px; cursor: pointer; }
.seg button.on { background: var(--accent-soft); color: var(--ink); }
input[type=search] { font: inherit; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); min-width: 200px; flex: 1; max-width: 320px; }
.count { color: var(--muted); margin-left: auto; }

.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px;
  margin-right: 5px; vertical-align: -1px; background: var(--c); }

h2.group { font-size: 16px; margin: 22px 0 10px; color: var(--muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: .06em; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.card { background: var(--panel); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow);
  cursor: pointer; display: flex; flex-direction: column; transition: transform .12s; border: 0; padding: 0;
  text-align: left; color: inherit; font: inherit; }
.card:hover { transform: translateY(-2px); }
.card .ph { aspect-ratio: 4/3; background: var(--line) center/cover no-repeat; }
.card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card .name { font-weight: 650; font-size: 15px; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; }
.badge { font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 99px; color: #fff; background: var(--c); }
.badge.hy { color: var(--hydro); background: color-mix(in srgb, var(--hydro) 10%, var(--panel));
  box-shadow: inset 0 0 0 1.5px var(--hydro); }
td.nm .badge { font-size: 10.5px; padding: 1px 6px; }
.m-head .badges { margin-top: 6px; }
.legend span.hy::before { background: color-mix(in srgb, var(--hydro) 10%, var(--panel)); box-shadow: inset 0 0 0 1.5px var(--hydro); }
.strip { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; margin-top: auto; padding-top: 4px; }
.strip i { height: 6px; border-radius: 2px; background: var(--line); }
.strip i.p { background: var(--sow); } .strip i.h { background: var(--harvest); }
.strip i.both { background: linear-gradient(90deg, var(--sow) 50%, var(--harvest) 50%); }
.strip i.cur { outline: 1.5px solid var(--ink); outline-offset: 1px; }
.empty { color: var(--muted); padding: 30px 0; }

/* Year chart */
.chart { background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 760px; }
th, td { padding: 0; }
thead th { position: sticky; top: 0; background: var(--panel); font-size: 12px; color: var(--muted);
  font-weight: 600; padding: 10px 0 6px; z-index: 1; }
thead th.cur { color: var(--accent); }
tbody tr { cursor: pointer; border-top: 1px solid var(--line); }
tbody tr:hover { background: var(--accent-soft); }
td.nm { padding: 5px 12px; white-space: nowrap; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
td.nm img { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; }
td.m { width: 6.5%; padding: 3px 2px; vertical-align: middle; }
td.m.cur { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.bars { display: flex; flex-direction: column; gap: 2px; }
.bars i { height: 6px; border-radius: 3px; background: var(--c); }
.bars i.none { background: transparent; }
tr.sec td { background: var(--bg); font-weight: 700; font-size: 12px; text-transform: uppercase;
  letter-spacing: .06em; color: var(--muted); padding: 8px 12px; cursor: default; }

/* Modal */
dialog { border: 0; padding: 0; border-radius: 18px; max-width: 760px; width: calc(100% - 32px);
  background: var(--panel); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(10,15,8,.55); }
.m-img { width: 100%; aspect-ratio: 16/8; object-fit: cover; display: block; background: var(--line); }
.m-body { padding: 18px 22px 22px; }
.m-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.m-head h3 { margin: 0; font-size: 24px; }
.m-head .tag { color: var(--muted); text-transform: capitalize; }
.close { border: 0; background: var(--accent-soft); color: var(--ink); font-size: 20px; width: 34px; height: 34px;
  border-radius: 50%; cursor: pointer; flex: none; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
.facts div { background: var(--bg); border-radius: 10px; padding: 8px 12px; }
.facts small { display: block; color: var(--muted); font-size: 12px; }
.facts .hydro { grid-column: 1 / -1; }
.facts .hydro b { color: var(--transplant); }
.facts .hydro.no b { color: var(--muted); }
.cal { display: grid; grid-template-columns: 110px repeat(12, 1fr); gap: 3px; font-size: 12px; align-items: center; }
.cal .h { text-align: center; color: var(--muted); font-weight: 600; }
.cal .h.cur { color: var(--accent); }
.cal .lbl { color: var(--muted); }
.cal .c { height: 16px; border-radius: 4px; background: var(--bg); }
.cal .c.on { background: var(--c); }
.tips { margin: 16px 0 6px; font-size: 15px; }
.credit { font-size: 11.5px; color: var(--muted); margin-top: 12px; }
.credit a { color: inherit; }

@media (max-width: 700px) {
  header, main { padding-left: 16px; padding-right: 16px; }
  .months { grid-template-columns: repeat(6, 1fr); }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .cal { grid-template-columns: 80px repeat(12, 1fr); font-size: 10px; }
  .count { margin-left: 0; }
}
</style>
</head>
<body>
<header>
  <h1>🌱 Claremont Garden Calendar</h1>
  <div class="sub">What to plant and harvest each month · USDA zone 10a · inland Southern California</div>
</header>
<main>
  <nav class="months" id="months"></nav>
  <div class="note" id="note"></div>

  <div class="controls">
    <div class="seg" id="mode">
      <button data-v="plant">🌱 Plant</button>
      <button data-v="harvest">🧺 Harvest</button>
      <button data-v="all">All crops</button>
    </div>
    <div class="seg" id="cat">
      <button data-v="all">All</button>
      <button data-v="vegetable">Vegetables</button>
      <button data-v="fruit">Fruits</button>
      <button data-v="herb">Herbs</button>
    </div>
    <div class="seg" id="hydro" title="Can it be grown hydroponically?">
      <button data-v="any">💧 Any</button>
      <button data-v="seeds">Hydro from seed</button>
      <button data-v="cuttings">Hydro from cuttings</button>
    </div>
    <div class="seg" id="view">
      <button data-v="cards">Cards</button>
      <button data-v="chart">Year chart</button>
    </div>
    <input type="search" id="q" placeholder="Search crops…">
    <span class="count" id="count"></span>
  </div>

  <div class="legend">
    <span style="--c:var(--indoors)">Start seeds indoors</span>
    <span style="--c:var(--sow)">Direct sow</span>
    <span style="--c:var(--transplant)">Transplant seedlings</span>
    <span style="--c:var(--plant)">Plant (trees, crowns, bulbs, slips)</span>
    <span style="--c:var(--harvest)">Harvest</span>
    <span class="hy">💧 Hydro Seed / Hydro Cutting: can be grown hydroponically that way</span>
  </div>

  <div id="out"></div>
</main>

<dialog id="dlg"></dialog>

<script src="data.js"></script>
<script>
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const ACTIONS = [
  { k: "indoors",    label: "Start indoors", c: "var(--indoors)" },
  { k: "sow",        label: "Direct sow",    c: "var(--sow)" },
  { k: "transplant", label: "Transplant",    c: "var(--transplant)" },
  { k: "plant",      label: "Plant",         c: "var(--plant)" },
];
const HARVEST = { k: "harvest", label: "Harvest", c: "var(--harvest)" };
const PLANT_KEYS = ACTIONS.map(a => a.k);
const SEASON_ORDER = { cool: 0, warm: 1, perennial: 2 };
const SEASON_LABEL = { cool: "Cool-season crops", warm: "Warm-season crops", perennial: "Perennials, fruit trees & vines" };

const NOTES = [
  "Bare-root season: the best time to plant low-chill stone fruit, apples, figs, grapes, berries, asparagus and artichokes. Frost is still possible — cover citrus and tender plants on clear, cold nights.",
  "Last frosts usually pass by late February. Keep planting bare-root trees, sow the last round of peas and greens, and start tomato and pepper seeds indoors.",
  "Spring planting begins. Transplant the first tomatoes once nights stay above 50°F, sow beans and squash late in the month, and plant citrus and avocados.",
  "Prime warm-season planting month: tomatoes, peppers, eggplant, squash, melons, corn, beans and sweet potatoes all go in now. Mulch before the heat arrives.",
  "Finish warm-season planting before June heat. Harvest garlic, onions and potatoes. Deep-water fruit trees as the weather warms.",
  "Heat is here. Plant heat lovers (okra, cowpeas, sweet potatoes, melons) and sow pumpkins for Halloween. Use shade cloth on young transplants.",
  "Hottest stretch of the year. Sow a second round of beans, cucumbers and squash, and set out tomato starts for a fall crop. Water early in the morning.",
  "Start fall crops indoors (broccoli, cabbage, cauliflower, leeks) out of the heat. Plant fall potatoes. Keep summer crops well watered.",
  "Fall garden begins as nights cool. Transplant brassicas, sow carrots, beets, lettuce, peas and greens. Late September to October is ideal for planting perennials.",
  "The best planting month of the year in SoCal. Sow nearly all cool-season crops, plant garlic, favas, strawberries and native shrubs. Fall rains (if any) help establish roots.",
  "Plant strawberries, garlic and short-day onion starts. Keep sowing lettuce, peas, radishes and spinach. Watch for the first frost late in the month.",
  "Order bare-root trees and plant them as they arrive. Sow favas and peas, plant onion sets. Protect frost-tender citrus, avocados and passion fruit on cold nights.",
];

const now = new Date().getMonth() + 1;
const store = {
  get(k, d) { try { const v = localStorage.getItem("garden:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("garden:" + k, JSON.stringify(v)); } catch {} },
};
const state = {
  month: now,
  mode: store.get("mode", "plant"),
  cat: store.get("cat", "all"),
  hydro: store.get("hydro", "any"),
  view: store.get("view", "cards"),
  q: "",
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);
const HYDRO_LABEL = { seeds: "Yes, from seeds", cuttings: "Yes, from cuttings", both: "Yes, from seeds or cuttings", no: "Not practical" };
const hydroChips = c => [
  ...(c.hydro === "seeds" || c.hydro === "both" ? ["Hydro Seed"] : []),
  ...(c.hydro === "cuttings" || c.hydro === "both" ? ["Hydro Cutting"] : []),
].map(l => `<span class="badge hy" title="${esc(c.hydro_note)}">💧 ${l}</span>`).join("");
const plantMonths = c => new Set(PLANT_KEYS.flatMap(k => c[k]));
const actionsIn = (c, m) => ACTIONS.filter(a => c[a.k].includes(m));

function filtered() {
  const q = state.q.trim().toLowerCase();
  return CROPS.filter(c =>
    (state.cat === "all" || c.cat === state.cat) &&
    (state.hydro === "any" || c.hydro === state.hydro || c.hydro === "both") &&
    (!q || c.name.toLowerCase().includes(q) || c.tips.toLowerCase().includes(q)) &&
    (state.mode === "all" || state.view === "chart" ||
      (state.mode === "plant" ? plantMonths(c).has(state.month) : c.harvest.includes(state.month)))
  ).sort((a, b) => SEASON_ORDER[a.season] - SEASON_ORDER[b.season] || a.name.localeCompare(b.name));
}

function renderMonths() {
  $("#months").innerHTML = MONTHS.map((m, i) =>
    `<button data-m="${i + 1}" class="${i + 1 === state.month ? "on" : ""} ${i + 1 === now ? "today" : ""}"
      title="${MONTHS_LONG[i]}${i + 1 === now ? " (this month)" : ""}">${m}</button>`).join("");
  $("#note").innerHTML = `<b>${MONTHS_LONG[state.month - 1]}:</b>${esc(NOTES[state.month - 1])}`;
}

function strip(c) {
  const p = plantMonths(c);
  return `<div class="strip" title="Green = plant, orange = harvest">${MONTHS.map((_, i) => {
    const m = i + 1, isP = p.has(m), isH = c.harvest.includes(m);
    return `<i class="${isP && isH ? "both" : isP ? "p" : isH ? "h" : ""} ${m === state.month ? "cur" : ""}"></i>`;
  }).join("")}</div>`;
}

function card(c) {
  const acts = state.mode === "harvest" ? (c.harvest.includes(state.month) ? [HARVEST] : [])
    : [...actionsIn(c, state.month), ...(state.mode === "all" && c.harvest.includes(state.month) ? [HARVEST] : [])];
  return `<button class="card" data-id="${c.id}">
    <div class="ph" style="background-image:url('${c.img || ""}')"></div>
    <div class="body">
      <div class="name">${esc(c.name)}</div>
      <div class="badges">${acts.map(a => `<span class="badge" style="--c:${a.c}">${a.label}</span>`).join("")}${hydroChips(c)}</div>
      ${strip(c)}
    </div></button>`;
}

function renderCards(list) {
  if (!list.length) return `<div class="empty">Nothing matches for ${MONTHS_LONG[state.month - 1]}.</div>`;
  const groups = {};
  list.forEach(c => (groups[c.season] ??= []).push(c));
  return Object.keys(groups).map(s =>
    `<h2 class="group">${SEASON_LABEL[s]} · ${groups[s].length}</h2><div class="grid">${groups[s].map(card).join("")}</div>`
  ).join("");
}

function renderChart(list) {
  if (!list.length) return `<div class="empty">No crops match.</div>`;
  let rows = "", last = null;
  for (const c of list) {
    if (c.season !== last) { rows += `<tr class="sec"><td colspan="13">${SEASON_LABEL[c.season]}</td></tr>`; last = c.season; }
    rows += `<tr data-id="${c.id}"><td class="nm">${c.img ? `<img src="${c.img}" alt="" loading="lazy">` : ""}${esc(c.name)}${hydroChips(c)}</td>${
      MONTHS.map((_, i) => {
        const m = i + 1;
        const bars = [...ACTIONS, HARVEST].filter(a => c[a.k].includes(m));
        return `<td class="m ${m === state.month ? "cur" : ""}"><div class="bars">${
          bars.map(a => `<i style="--c:${a.c}" title="${a.label} · ${MONTHS[i]}"></i>`).join("")}</div></td>`;
      }).join("")}</tr>`;
  }
  return `<div class="chart"><table><thead><tr><th></th>${
    MONTHS.map((m, i) => `<th class="${i + 1 === state.month ? "cur" : ""}">${m}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function render() {
  for (const k of ["mode", "cat", "hydro", "view"])
    document.querySelectorAll(`#${k} button`).forEach(b => b.classList.toggle("on", b.dataset.v === state[k]));
  $("#mode").style.display = state.view === "chart" ? "none" : "";
  renderMonths();
  const list = filtered();
  const what = state.view === "chart" ? "crops" :
    state.mode === "plant" ? `to plant in ${MONTHS_LONG[state.month - 1]}` :
    state.mode === "harvest" ? `to harvest in ${MONTHS_LONG[state.month - 1]}` : "crops";
  $("#count").textContent = `${list.length} ${what}`;
  $("#out").innerHTML = state.view === "chart" ? renderChart(list) : renderCards(list);
}

function openCrop(id) {
  const c = CROPS.find(x => x.id === id);
  const rows = [...ACTIONS, HARVEST].filter(a => c[a.k].length);
  const cr = c.credit;
  $("#dlg").innerHTML = `
    ${c.img ? `<img class="m-img" src="${c.img}" alt="${esc(c.name)}">` : ""}
    <div class="m-body">
      <div class="m-head">
        <div><h3>${esc(c.name)}</h3><div class="tag">${c.cat} · ${c.season === "perennial" ? "perennial" : c.season + " season"}</div><div class="badges">${hydroChips(c)}</div></div>
        <button class="close" aria-label="Close">×</button>
      </div>
      <div class="facts">
        <div><small>Time to harvest</small>${esc(c.days)}</div>
        <div><small>Sun</small>${esc(c.sun)}</div>
        <div><small>Spacing</small>${esc(c.spacing)}</div>
        <div class="hydro ${c.hydro}"><small>Grow hydroponically?</small><b>${HYDRO_LABEL[c.hydro]}</b> · ${esc(c.hydro_note)}</div>
      </div>
      <div class="cal">
        <div></div>${MONTHS.map((m, i) => `<div class="h ${i + 1 === state.month ? "cur" : ""}">${m[0]}</div>`).join("")}
        ${rows.map(a => `<div class="lbl">${a.label}</div>${
          MONTHS.map((_, i) => `<div class="c ${c[a.k].includes(i + 1) ? "on" : ""}" style="--c:${a.c}"></div>`).join("")}`).join("")}
      </div>
      <p class="tips">${esc(c.tips)}</p>
      ${cr ? `<div class="credit">Photo: ${esc(cr.artist || "Unknown")}${cr.license ? `, ${esc(cr.license)}` : ""}, via Wikimedia Commons${
        cr.source ? ` (<a href="${esc(cr.source)}" target="_blank" rel="noopener">source</a>)` : ""}</div>` : ""}
    </div>`;
  $("#dlg").showModal();
  $("#dlg .close").onclick = () => $("#dlg").close();
}

$("#months").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.month = +b.dataset.m; render();
});
for (const k of ["mode", "cat", "hydro", "view"])
  $("#" + k).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state[k] = b.dataset.v; store.set(k, state[k]); render();
  });
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("#out").addEventListener("click", e => {
  const el = e.target.closest("[data-id]"); if (el) openCrop(el.dataset.id);
});
$("#dlg").addEventListener("click", e => { if (e.target.id === "dlg") $("#dlg").close(); });
document.addEventListener("keydown", e => {
  if ($("#dlg").open || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") { state.month = (state.month + 10) % 12 + 1; render(); }
  if (e.key === "ArrowRight") { state.month = state.month % 12 + 1; render(); }
});

render();
</script>
</body>
</html>
